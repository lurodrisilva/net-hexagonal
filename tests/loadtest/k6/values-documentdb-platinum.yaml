# Platinum tier overlay — DocumentDB M50 (8 vCPU, 32 GiB RAM, HA on, primary
# + standby). Upgraded in place from M40 — see
# docs/loadtest-run-2026-05-04-documentdb-platinum-m50.md.
#
# Apply with:
#   helm upgrade --install hex-scaffold ./deploy/helm/hex-scaffold \
#     -n hex-scaffold \
#     -f tests/loadtest/k6/values-documentdb-platinum.yaml \
#     --set secrets.mongoConnectionString='<from secret>'

features:
  inbound: rest
  outbound: rest
  persistence: mongo

application:
  mongoDatabaseName: "hex-scaffold"
  environment: Production

migrations:
  enabled: false

# Platinum app profile (M50, 8 vCPU + 32 GiB) — 12 base replicas, HPA scales
# to 32. Bumped from 8/24 (M40 baseline) per the Gold/Platinum follow-up
# observations: M40 was already app-tier queue-bound at 8/24; M50 doubles DB
# compute, so app footprint is doubled to give the DB tier a fair shake at
# saturation rather than re-bottlenecking on the app side.
replicaCount: 12
resources:
  requests:
    cpu: 80m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 12
  maxReplicas: 32
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

rateLimit:
  permitLimit: 100000
  windowSeconds: 60
  queueLimit: 0
