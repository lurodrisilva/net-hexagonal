# Platinum+ tier overlay — DocumentDB M60 (16 vCPU, 64 GiB RAM, HA on, primary
# + zone-redundant standby). New top-of-ladder tier targeting ≈10k RPS.
# Provisioned as a parallel cluster (NOT in-place upgrade from M50) — keeps
# the M50 Platinum baseline live and adds Platinum+ as the new ceiling.
#
# Apply with:
#   helm upgrade --install hex-scaffold ./deploy/helm/hex-scaffold \
#     -n hex-scaffold \
#     -f tests/loadtest/k6/values-documentdb-platinum-plus.yaml \
#     --set secrets.mongoConnectionString='<from secret>'

features:
  inbound: rest
  outbound: rest
  persistence: mongo

application:
  mongoDatabaseName: "hex-scaffold"
  environment: Production

migrations:
  enabled: false

# Platinum+ app profile (M60, 16 vCPU + 64 GiB DB) — 24 base replicas, HPA
# scales to 64. Doubled from M50's 12/32 in proportion to the doubled DB
# compute. Per-pod requests bumped from 80m/384Mi to 200m/512Mi to keep p95
# tight under sustained 10k-RPS load (less HPA scale-up churn, less driver
# queueing). MaxConnectionPoolSize stays at 100 (PR #42) — 64 pods × 100 =
# 6400 connections fits inside M60's connection ceiling (~6400+).
replicaCount: 24
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 24
  maxReplicas: 64
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 8
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

rateLimit:
  permitLimit: 200000
  windowSeconds: 60
  queueLimit: 0
