# Platinum+ tier overlay — PostgreSQL Flexible Server D16ds_v5 (16 vCPU,
# 64 GiB RAM, Premium SSD v2). New top-of-ladder tier targeting ≈10k RPS.
# Provisioned as a parallel server (NOT in-place upgrade from D8ds_v5) —
# keeps the D8 Platinum baseline live and adds Platinum+ as the new ceiling.
#
# Apply with:
#   helm upgrade --install hex-scaffold ./deploy/helm/hex-scaffold \
#     -n hex-scaffold \
#     -f tests/loadtest/k6/values-pgsql-pp-platinum-plus.yaml \
#     --set secrets.postgresConnectionString='<from secret>'

features:
  inbound: rest
  outbound: rest
  persistence: postgres

application:
  environment: Production

migrations:
  enabled: true

# Platinum+ app profile (D16ds_v5, 16 vCPU + 64 GiB DB) — app-tier scale-up.
#
# First Platinum+ run (2026-05-04, 24 replicas / HPA 24-64 / limits 1500m)
# capped at ~5,107 RPS with HPA pinned at 64/64 and DB CPU only 24.18%.
# The bottleneck was upstream of the DB: per-pod CPU saturated long before
# Postgres did. To push closer to the 10k RPS target this overlay widens the
# app tier in three ways:
#   1. HPA max  64 → 128  (2× headroom for horizontal scale)
#   2. base replicas 24 → 32  (warmer fleet at peak, less ramp lag)
#   3. per-pod CPU request 200m → 100m, limit 1500m → 2000m
#
# Why drop the request from 200m to 100m? Adding cluster nodes was attempted
# (scale nodepool / nodepool2 to 18 each) and was BLOCKED by the Azure
# tenant's MCAPS deny policy on this subscription — neither D2s_v3 nor D2s_v6
# new VMs are allowed in brazilsouth via this AKS cluster. So we have to fit
# more app pods inside the existing 22-node fleet (10 × D2s_v3 nodepool, 10 ×
# D2s_v6 nodepool2, 2 × D8s_v6 nodepool3 reserved for k6 runners).
#
# kubectl top showed nodepool/nodepool2 nodes at only 13-39% actual CPU
# despite scheduler-side request budget being tight (cert-manager, argocd,
# vault on nodepool consume request slots they barely use at runtime).
# Halving the request from 200m to 100m doubles the schedulable density
# without changing real CPU demand — actual per-pod use under load is ~210m
# (measured), well above the 100m request, so HPA still scales aggressively.
#
# nodepool3 was independently scaled 5 → 2 (k6 runners need ~3.6 vCPU; the
# previous 5×D8s_v6 = 40 vCPU was hugely over-provisioned) — see the matching
# affinity block at the bottom of this file and testrun-pgsql-pp.yaml.
#
# Postgres MaxPoolSize stays at 100 — 128 pods × 100 = 12 800 max client-side
# connection slots, but actual concurrent connections under steady RPS stay
# well below D16ds_v5's ~5 000 server-side ceiling (first run peaked at 745).
replicaCount: 32
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 32
  maxReplicas: 128
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 8
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

rateLimit:
  permitLimit: 200000
  windowSeconds: 60
  queueLimit: 0

# Spread app pods across ALL three nodepools — nodepool, nodepool2 AND nodepool3.
# Originally we wanted to keep nodepool3 reserved for k6 runners, but the Azure
# tenant's MCAPS deny policy blocks adding nodes to either nodepool or nodepool2,
# so we have to use every node we have. nodepool3 was scaled down to 2 × D8s_v6
# (= 16 vCPU); k6 runners only need ~3.6 vCPU (6 runners × 600m), leaving
# ~12 vCPU on nodepool3 — plenty of headroom for app pods to share with the
# load generators without starving them. Free request budget by nodepool right
# now: ~5.6 (nodepool) + ~7-8 (nodepool2) + ~13.4 (nodepool3) ≈ 26 vCPU.
# 128 pods × 100m = 12.8 vCPU comfortably fits.
#
# We use a soft preference (preferredDuringScheduling…) to nudge pods toward
# nodepool2 and nodepool3 (which have more free request budget than nodepool,
# whose D2s_v3 nodes carry cert-manager/argocd/vault). No required affinity:
# pods can land on any nodepool the scheduler picks.
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 80
        preference:
          matchExpressions:
            - key: agentpool
              operator: In
              values:
                - nodepool2
                - nodepool3
