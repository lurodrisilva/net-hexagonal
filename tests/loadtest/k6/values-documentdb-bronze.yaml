# Bronze tier overlay — DocumentDB M10 (0.5 vCPU, no HA).
#
# Apply with:
#   helm upgrade --install hex-scaffold ./deploy/helm/hex-scaffold \
#     -n hex-scaffold \
#     -f tests/loadtest/k6/values-documentdb-bronze.yaml \
#     --set secrets.mongoConnectionString='<from secret>'
#
# Overrides only what differs from the chart defaults.

features:
  inbound: rest
  outbound: rest
  persistence: mongo

application:
  mongoDatabaseName: "hex-scaffold"
  environment: Production

# Migrations are Postgres-only — disable for Mongo runs.
migrations:
  enabled: false

# Bronze app profile — 4 base replicas, HPA scales to 8.
replicaCount: 4
resources:
  requests:
    cpu: 80m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

# Bump rate limiter well above the load-test arrival rate.
rateLimit:
  permitLimit: 100000
  windowSeconds: 60
  queueLimit: 0
