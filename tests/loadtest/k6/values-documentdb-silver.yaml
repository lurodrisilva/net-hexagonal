# Silver tier overlay — DocumentDB M20 (1 vCPU, no HA — platform constraint).
#
# Apply with:
#   helm upgrade --install hex-scaffold ./deploy/helm/hex-scaffold \
#     -n hex-scaffold \
#     -f tests/loadtest/k6/values-documentdb-silver.yaml \
#     --set secrets.mongoConnectionString='<from secret>'

features:
  inbound: rest
  outbound: rest
  persistence: mongo

application:
  mongoDatabaseName: "hex-scaffold"
  environment: Production

migrations:
  enabled: false

# Silver app profile — 6 base replicas, HPA scales to 12.
replicaCount: 6
resources:
  requests:
    cpu: 80m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 6
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

rateLimit:
  permitLimit: 100000
  windowSeconds: 60
  queueLimit: 0
