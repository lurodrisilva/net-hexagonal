{{- include "hex-scaffold.validateFeatures" . -}}
# ConfigMap — the single source of truth for the runtime adapter selector
# and every non-secret knob the application reads. Mounted into the pod as
# environment variables (Kubernetes double-underscore → .NET config section
# delimiter).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hex-scaffold.fullname" . }}
  labels:
    {{- include "hex-scaffold.labels" . | nindent 4 }}
  # Rendered as a pre-install/pre-upgrade hook (weight -10) so it lands BEFORE
  # the migration Job (weight -5), which envFroms it. before-hook-creation
  # leaves the object in place so the regular Deployment can also mount it,
  # and `helm uninstall` still removes it (no resource-policy=keep).
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  # --- Feature selector -----------------------------------------------------
  Features__InboundAdapter:  {{ .Values.features.inbound  | quote }}
  Features__OutboundAdapter: {{ .Values.features.outbound | quote }}
  Features__Persistence:     {{ .Values.features.persistence | quote }}
  Features__UseRedis:        {{ .Values.features.redis | quote }}

  # --- App runtime ---------------------------------------------------------
  ASPNETCORE_ENVIRONMENT:   {{ .Values.application.environment | quote }}
  ASPNETCORE_URLS:          "http://+:{{ .Values.application.port }}"
  DOTNET_RUNNING_IN_CONTAINER: "true"

  # --- MongoDB database name (only honored when Persistence=mongo) ----------
  MongoDB__DatabaseName:    {{ .Values.application.mongoDatabaseName | quote }}

  # service.namespace resource attribute. Used by the Application Insights
  # Cloud-role-name derivation so multi-service workspaces don't collapse to
  # one node on the App Map. service.instance.id is set per-pod via the
  # downward API in the Deployment template (OTEL_SERVICE_INSTANCE_ID env).
  OpenTelemetry__ServiceNamespace: {{ .Values.observability.serviceNamespace | quote }}

  # --- External REST API (outbound HTTP adapter) ---------------------------
  # Resolved via the hex-scaffold.externalApiBaseUrl helper: in-cluster
  # WireMock when wiremock.enabled, otherwise secrets.externalApiBaseUrl.
  ExternalApi__BaseUrl:     {{ include "hex-scaffold.externalApiBaseUrl" . | quote }}

  # --- Kafka consumer group (producer bootstrap is in the Secret) ----------
  Kafka__ConsumerGroupId:   {{ .Values.secrets.kafkaConsumerGroupId | quote }}
  Kafka__InboundTopic:      {{ .Values.kafka.inboundTopic | quote }}
  Kafka__MaxPollRecords:    {{ .Values.kafka.maxPollRecords | quote }}
  Kafka__FetchMinBytes:     {{ .Values.kafka.fetchMinBytes | quote }}
  Kafka__CompressionType:   {{ .Values.kafka.compressionType | quote }}

  # --- Rate limiter (fixed window, per-IP) ----------------------------------
  RateLimit__PermitLimit:    {{ .Values.rateLimit.permitLimit    | quote }}
  RateLimit__WindowSeconds:  {{ .Values.rateLimit.windowSeconds  | quote }}
  RateLimit__QueueLimit:     {{ .Values.rateLimit.queueLimit     | quote }}

  # --- Observability sampling (OTel TracerProvider + classic AI SDK) -------
  # OTel pipeline ratio: ParentBased(TraceIdRatio) — see ObservabilityConfig.cs.
  # Loadtest overlay drops this to 0.1 to keep AI ingest under cap.
  Observability__Sampling__TracesRatio:    {{ .Values.observability.sampling.tracesRatio | quote }}
  # Classic-SDK adaptive sampling per-pod ceiling (drives QuickPulse / Live Metrics).
  ClassicSdk__MaxTelemetryItemsPerSecond:  {{ .Values.classicSdk.maxTelemetryItemsPerSecond | quote }}

  # --- Serilog level overlay (loadtest overlay lowers root to Warning) -----
  Serilog__MinimumLevel__Default: {{ .Values.observability.logging.rootLevel | quote }}
  {{- range $namespace, $level := .Values.observability.logging.overrides }}
  Serilog__MinimumLevel__Override__{{ $namespace }}: {{ $level | quote }}
  {{- end }}
