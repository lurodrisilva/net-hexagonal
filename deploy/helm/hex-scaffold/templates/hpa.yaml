{{- if .Values.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "hex-scaffold.fullname" . }}
  labels:
    {{- include "hex-scaffold.labels" . | nindent 4 }}
  {{- if .Values.argo.enabled }}
  annotations:
    # Co-wave with the app Deployment. Without this the HPA defaults to sync-wave
    # 0 while its target Deployment is at syncWave.app (a later wave), so ArgoCD
    # applies the HPA first; it reports "deployments.apps <name> not found",
    # wave 0 never goes healthy, and the migration + app waves never run.
    argocd.argoproj.io/sync-wave: {{ .Values.argo.syncWave.app | quote }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "hex-scaffold.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- with .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ . }} }
    {{- end }}
    {{- with .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: {{ . }} }
    {{- end }}
  {{- with .Values.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
