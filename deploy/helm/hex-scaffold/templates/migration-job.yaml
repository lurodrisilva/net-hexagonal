{{- if and .Values.migrations.enabled (eq .Values.features.persistence "postgres") -}}
# EF Core schema migration — runs as a Helm pre-install / pre-upgrade hook so
# the Deployment only starts once `dotnet ef database update` completes.
# Idempotent: EF's __EFMigrationsHistory table records applied migrations.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hex-scaffold.fullname" . }}-migrate
  labels:
    {{- include "hex-scaffold.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.argo.enabled }}
    # Umbrella / app-of-apps under ArgoCD: run as a Sync hook at a sync-wave
    # AFTER the infra wave. A pure Helm pre-install hook would map to ArgoCD
    # PreSync and race the database outright.
    #
    # The wave gate alone is NOT sufficient, and how it fails depends on engine:
    #   cloudnativepg        ArgoCD's built-in postgresql.cnpg.io health check
    #                        gates the wave properly.
    #   azure-flexibleserver ArgoCD ships no health check for a Crossplane XR and
    #                        defaults unassessable kinds to Healthy, so the wave
    #                        clears instantly. aks-foundation registers a
    #                        platform.myorg.io health check to fix this; the
    #                        wait initContainer below (G-T7) is the backstop that
    #                        holds even when cluster config does not.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: {{ .Values.argo.syncWave.migration | quote }}
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- else }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "hex-scaffold.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        fsGroup: 1654
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.migrations.wait.enabled .Values.postgres.bindBuildingBlock.enabled }}
      # G-T7 — do not migrate against a host that is not answering yet. See
      # migrations.wait in values.yaml for why the sync-wave gate is not enough.
      initContainers:
        - name: wait-for-db
          image: {{ printf "%s:%s" .Values.migrations.wait.image.repository .Values.migrations.wait.image.tag }}
          imagePullPolicy: {{ .Values.migrations.wait.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1654
            capabilities: { drop: [ALL] }
          # PGHOST/PGPORT only — the wait has no business holding credentials.
          # Under azure-flexibleserver PGHOST is a secretKeyRef into the
          # connection secret, so this container cannot even be scheduled until
          # Crossplane has written the FQDN.
          env:
            {{- include "hex-scaffold.pgBindHostEnv" . | nindent 12 }}
            - name: WAIT_TIMEOUT
              value: {{ .Values.migrations.wait.timeoutSeconds | quote }}
            - name: WAIT_INTERVAL
              value: {{ .Values.migrations.wait.intervalSeconds | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "waiting up to ${WAIT_TIMEOUT}s for ${PGHOST}:${PGPORT}"
              elapsed=0
              # Resolving and connecting are separate failures: private DNS can
              # lag the server going Ready, so report which one is stuck rather
              # than a bare timeout.
              while true; do
                if nslookup "${PGHOST}" >/dev/null 2>&1; then
                  if nc -z -w 3 "${PGHOST}" "${PGPORT}"; then
                    echo "${PGHOST}:${PGPORT} is accepting connections after ${elapsed}s"
                    exit 0
                  fi
                  state="resolves, not accepting connections"
                else
                  state="does not resolve yet"
                fi
                if [ "${elapsed}" -ge "${WAIT_TIMEOUT}" ]; then
                  echo "gave up after ${elapsed}s: ${PGHOST} ${state}" >&2
                  exit 1
                fi
                echo "  ${elapsed}s: ${PGHOST} ${state}"
                sleep "${WAIT_INTERVAL}"
                elapsed=$((elapsed + WAIT_INTERVAL))
              done
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "hex-scaffold.migrationImage" . }}
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1654
            capabilities: { drop: [ALL] }
          # The runtime image is chiseled (no shell, no SDK) — invoke the
          # self-contained EF migration bundle baked in at build time. It reads
          # ConnectionStrings__PostgreSql from the Secret via envFrom through
          # the startup project's IConfiguration (no connection string on the
          # command line → no `ps` leakage).
          command: ["/app/efbundle"]
          envFrom:
            - configMapRef:
                name: {{ include "hex-scaffold.fullname" . }}
            - secretRef:
                name: {{ include "hex-scaffold.fullname" . }}
          {{- if .Values.postgres.bindBuildingBlock.enabled }}
          # Explicit env overrides envFrom on key collision, so the composed
          # ConnectionStrings__PostgreSql here wins over the (now-skipped) Secret.
          env:
            {{- include "hex-scaffold.pgBindEnv" . | nindent 12 }}
          {{- end }}
{{- end }}
