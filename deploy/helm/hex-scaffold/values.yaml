# ---------------------------------------------------------------------------
# hex-scaffold / values.yaml
#
# The chart is opinionated: pick ONE inbound, ONE outbound, ONE primary
# persistence store. Redis is optional and only valid with PostgreSQL.
# The "features" block below is the single source of truth and is rendered
# verbatim into the ConfigMap consumed by the application.
# ---------------------------------------------------------------------------

image:
  repository: ghcr.io/lurodrisilva/net-hexagonal
  tag: "latest"                       # defaults to .Chart.AppVersion
  # An immutable digest ("sha256:..."). When set it WINS over `tag`. CI injects
  # the digest it just built when packaging the umbrella, so a published chart
  # version deploys exactly one image (ADR-0014).
  digest: ""
  # `Always` because `:latest` is a mutable tag — IfNotPresent would let nodes
  # keep serving a stale cached digest after a new image is pushed. Override to
  # IfNotPresent when pinning to an immutable semver or sha tag.
  pullPolicy: Always
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# -- Adapter / persistence selection (drives ConfigMap + conditional templates).
#    Allowed:
#      inbound:     rest | kafka
#      outbound:    rest | kafka
#      persistence: postgres | mongo
#      redis:       true | false   (only legal when persistence=postgres)
features:
  inbound: rest
  outbound: rest
  persistence: postgres
  redis: false

# -- Container-level env overrides (merged after ConfigMap/Secret refs).
env: []

# -- ArgoCD ordering. When enabled, resources are ordered with ArgoCD sync-waves
#    instead of Helm hooks so this chart can run as a subchart of an umbrella (or
#    in an app-of-apps) that provisions data infra in an earlier wave. The
#    migration Job becomes an ArgoCD Sync hook at syncWave.migration and the
#    Deployment gets syncWave.app, so the CNPG Cluster (earlier wave, health-gated
#    by ArgoCD's built-in CloudNativePG check) is Ready before migrations run.
#    Leave disabled for standalone `helm install` (Helm pre-install hook ordering).
argo:
  enabled: false
  syncWave:
    migration: "1"
    app: "2"

# -- Connection strings / secrets referenced by the app. Prefer external
#    secret management (CSI driver, ExternalSecrets, Sealed Secrets) in prod;
#    the values here feed a Secret template suitable for local / demo use.
secrets:
  # Postgres connection string (used when features.persistence=postgres)
  postgresConnectionString: "Host=pgsql-pp-platinum-1.postgres.database.azure.com;Database=postgres;Username=adminpg;Password=;Port=5432;Maximum Pool Size=100"
  # Mongo connection string  (used when features.persistence=mongo)
  mongoConnectionString: "mongodb://mongo:27017"
  # Redis connection string  (used when features.redis=true)
  redisConnectionString: "redis:6379"
  # Kafka bootstrap           (used when any features.*=kafka)
  kafkaBootstrapServers: "kafka-bootstrap.kafka.svc:9092"
  kafkaConsumerGroupId: "hex-scaffold-group"
  # External REST API the outbound HTTP adapter targets (always registered)
  externalApiBaseUrl: "https://httpbin.org"

# -- Bind Postgres to a platform building block instead of the literal
#    secrets.postgresConnectionString above. When enabled, credentials flow ONLY
#    via secretKeyRef and the connection string is composed with Kubernetes
#    $(VAR) expansion — no plaintext credential is templated. Leave disabled for
#    the standalone/demo path.
#
# Two shapes, because the building block's contract is engine-specific (ADR-0020):
#
#   Literal mode (cloudnativepg). Host and database are the block's deterministic
#   in-cluster outputs, known when the Application is authored:
#     secretName: acct-secret   # keys: username, password
#     host: acct-rw
#     database: acct-db
#
#   secretKeyRef mode (azure-flexibleserver, G-T6). The private FQDN does not
#   exist until Crossplane provisions the server, so it CANNOT be a literal — it
#   is resolved at pod start from the connection secret. Azure also splits the
#   contract across TWO secrets: the composed <name>-postgres-conn carries
#   host/username/dbname, while the password is generated by the provider into
#   <name>-admin-password. Hence per-field refs rather than one secretName:
#     hostFrom:     {name: acct-postgres-conn,  key: host}
#     usernameFrom: {name: acct-postgres-conn,  key: username}
#     passwordFrom: {name: acct-admin-password, key: password}
#     databaseFrom: {name: acct-postgres-conn,  key: dbname}
#
# The two mix freely: any *From ref set below wins over its literal counterpart.
# This chart deliberately does NOT know engine names — it only knows whether a
# field is a literal or a secret key, so a third engine needs no code here.
postgres:
  bindBuildingBlock:
    enabled: false
    # --- azure-flexibleserver mode (one knob) -------------------------------
    # The SQL building block's instance name — the same value as the building
    # block's `databases.sql[].name`, which is also the PostgresInstance XR name.
    # Setting it derives ALL FOUR refs below:
    #
    #   hostFrom      {name: <instanceName>-postgres-conn,  key: host}
    #   usernameFrom  {name: <instanceName>-postgres-conn,  key: username}
    #   databaseFrom  {name: <instanceName>-postgres-conn,  key: dbname}
    #   passwordFrom  {name: <instanceName>-admin-password, key: password}
    #
    # Those names are the azure-flexibleserver contract, not a neutral one: the
    # host/username/dbname Secret is composed by the control plane and the
    # password is generated by the Crossplane provider into a separate Secret.
    # ADR-0020 records why no single contract spans both engines. For
    # cloudnativepg use the literals below instead — setting both is rejected.
    #
    # This exists because the XR name and these four refs are otherwise
    # independent values restating one fact: a rename that misses one yields an
    # app waiting forever on a Secret nothing will create.
    instanceName: ""
    # --- literal mode (cloudnativepg) --------------------------------------
    secretName: ""     # the building block's <name>-secret (keys: username, password)
    host: ""           # <name>-rw
    database: ""       # <name>-db
    port: 5432         # constant; the Composition hardcodes 5432 too
    # --- secretKeyRef overrides (G-T6) --------------------------------------
    # Each is {name, key}. Empty = derive from instanceName, else use the
    # literal above. An explicit ref always wins over the derivation, so an
    # unusual Secret layout stays expressible without abandoning instanceName.
    hostFrom: {}
    usernameFrom: {}
    passwordFrom: {}
    databaseFrom: {}

kafka:
  # Inbound topic consumed by AccountEventConsumer (features.inbound=kafka).
  # Override per-environment via Helm --set or a values overlay so load-test
  # runs can target isolated topics without touching the default prod topic.
  inboundTopic: "v2.core.accounts"
  # Consumer prefetch + fetch-batching knobs. Defaults match the Confluent.Kafka
  # library defaults so production behaviour is unchanged. Per-tier loadtest
  # overlays raise these to amortise broker round-trip cost at high throughput.
  # See KafkaOptions.cs for the MaxPollRecords→QueuedMinMessages mapping.
  maxPollRecords: 500
  fetchMinBytes: 1
  # Bulk-write coalescing knobs (Phase 5 v2). The consumer drains up to
  # batchSize messages per poll (or up to batchLingerMs after the first
  # arrives, whichever comes first) and flushes the whole batch through
  # IAccountBatchProcessor.ProcessAsync in a SINGLE SaveBatchAsync round
  # trip. Defaults match the .NET KafkaOptions defaults; per-tier loadtest
  # overlays raise batchSize to 750 (gold) / 1500 (platinum). Tune the
  # linger downward if tail latency on light traffic matters.
  batchSize: 200
  batchLingerMs: 50
  # Producer wire-compression codec (none|gzip|snappy|lz4|zstd). Default lz4 —
  # ~3-4× reduction on Stripe-shaped JSON at low CPU cost. Loadtest topic CRs
  # already pin compression.type=lz4 and the broker is set to honour the
  # producer codec (kafka-cluster.yaml: compression.type=producer), so this
  # default keeps the producer aligned end-to-end.
  compressionType: "lz4"
  # Azure Application Insights connection string. Leave empty to disable the
  # Azure Monitor exporter (the OTLP pipeline still runs). Inject via a real
  # SecretProviderClass / ExternalSecret in production.
  appInsightsConnectionString: "InstrumentationKey=84057efc-9957-45a5-b19b-5c60cd12890e;IngestionEndpoint=https://brazilsouth-1.in.applicationinsights.azure.com/;LiveEndpoint=https://brazilsouth.livediagnostics.monitor.azure.com/;ApplicationId=e65c9fd9-b510-48e7-894f-32f69a230d6d"

application:
  port: 8080
  # The `MongoDB__DatabaseName` env var; ignored when persistence=postgres.
  mongoDatabaseName: "hex-scaffold"
  # ASPNETCORE_ENVIRONMENT
  environment: Production

# -- Rate limiter — fixed-window limiter applied per-IP (also as the global
#    limiter). Tune for the workload: the defaults below mirror the original
#    hardcoded scaffold values (100 req / 60 s) which are intentionally
#    conservative for a demo. Bump well above the test arrival rate before
#    running the k6 load test (e.g. permitLimit: 100000) — otherwise the
#    runner pods will be 429-throttled and `http_req_failed` will explode.
rateLimit:
  permitLimit: 100
  windowSeconds: 60
  queueLimit: 0

# -- WireMock — in-cluster HTTP API mock used by the outbound REST adapter
#    (IExternalApiClient). When enabled, ExternalApi__BaseUrl is rewritten to
#    point at the WireMock service so the app hits a deterministic mock with
#    a baked-in response delay (default 300ms) instead of an external host.
#    The skill `wiremock-api-mocks` documents the broader platform-tier shared-
#    instance pattern; here we ship a self-contained, per-release WireMock for
#    scaffold/demo use.
wiremock:
  enabled: true
  # Scale WireMock for high-concurrency load tests. With the app tier scaled
  # to 16 replicas under HPA, a single WireMock at 250m CPU becomes the
  # bottleneck (queue buildup pushes p95 to ~2-3s, throughput collapses,
  # and DB CPU paradoxically *drops*). 4 replicas × 1000m limit = 4 vCPU
  # of mock capacity, comfortably above the outbound-call rate we generate.
  replicaCount: 4
  image:
    repository: wiremock/wiremock
    # Pinned to an immutable patched tag because the floating "3-alpine" alias
    # was returning 404 from Docker Hub in some pull contexts.
    tag: "3.13.2-3-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 500m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 768Mi
  # Global response delay (milliseconds) injected into every stub's response
  # at render time. Lets the application's HttpClient resilience pipeline
  # observe a realistic latency without per-stub bookkeeping.
  fixedDelayMs: 300
  # Stub mappings rendered as individual files into the WireMock ConfigMap and
  # loaded at startup. The fixedDelayMs above is merged into each `response`
  # automatically — do not duplicate it here. Add more entries as the
  # application grows; each becomes /home/wiremock/mappings/<key>.json.
  mappings:
    catchall:
      request:
        method: ANY
        urlPattern: ".*"
      response:
        status: 200
        headers:
          Content-Type: "application/json"
        jsonBody:
          source: "wiremock"
          message: "stubbed by hex-scaffold helm chart"

# -- Database migrations (PostgreSQL only). When enabled, a Helm pre-install /
#    pre-upgrade Job runs `dotnet ef database update` before the Deployment
#    rolls. No-op when persistence=mongo.
migrations:
  enabled: true
  image:
    # Uses the same image as the app. The runtime image ships a self-contained
    # EF migration bundle at /app/efbundle (produced by `dotnet ef migrations
    # bundle --self-contained` in the Dockerfile build stage), so the chiseled
    # runtime can run migrations without a shell or the .NET SDK.
    repository: ghcr.io/lurodrisilva/net-hexagonal
    tag: ""                     # defaults to .Chart.AppVersion
    digest: ""                  # immutable "sha256:..."; wins over tag (see image.digest)
    # Same rationale as image.pullPolicy above — the migration Job references
    # the mutable `:latest` tag by default, so force a re-pull on every run.
    pullPolicy: Always
  backoffLimit: 3
  # Bounds the whole Job — wait initContainer INCLUDED. Must stay above
  # wait.timeoutSeconds below, or the deadline fires first and the wait's
  # diagnostic ("gave up on <host>") never prints.
  activeDeadlineSeconds: 1200
  # G-T7 — wait for the database to actually answer before migrating.
  #
  # Two things can let the migration Job start too early:
  #   1. ArgoCD has no health check for a Crossplane XR and defaults unassessable
  #      kinds to Healthy, so the infra sync-wave "completes" instantly even
  #      though the server takes 5–10 min to exist. (The platform.myorg.io health
  #      check in aks-foundation closes this; this initContainer is the in-pod
  #      backstop that does not depend on cluster config being right.)
  #   2. Private DNS can lag the server going Ready, so the FQDN resolves late.
  #
  # Secret EXISTENCE needs no polling here: every credential is consumed via
  # secretKeyRef, and the kubelet refuses to start a container whose Secret is
  # missing (CreateContainerConfigError) and retries until it appears. What the
  # kubelet cannot check is whether the host answers — that is this wait.
  #
  # Engine-agnostic and near-free when the host is already up (cloudnativepg:
  # one successful TCP connect, then exit).
  wait:
    enabled: true
    image:
      # The migration image is chiseled — no shell, no nc — so the wait cannot
      # run in it and needs its own tiny image.
      repository: busybox
      tag: "1.37.0-musl"
      pullPolicy: IfNotPresent
    # Give up (and fail the Job) after this long. Sized for Flexible Server's
    # 5–10 min provisioning plus DNS propagation; the Job's own
    # activeDeadlineSeconds must exceed it or the deadline wins first.
    timeoutSeconds: 900
    intervalSeconds: 5

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hex-scaffold.local
      paths:
        - path: /
          pathType: Prefix
  tls: []


replicaCount: 10
resources:
  requests:
    cpu: 80m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 8
  maxReplicas: 16
  # Target keeps pods at <=70% CPU saturation (well under the 75% ceiling we
  # tolerate for these load tests). HPA scales out the moment average pod CPU
  # crosses 70%, so steady-state never sits at limit.
  targetCPUUtilizationPercentage: 70
  # Memory: capped at 75% so the chart never sits a working set right at the
  # OOM-kill cliff (limit=768Mi). The tests are CPU-bound; this is a safety
  # net for the .NET GC's working-set drift under sustained load.
  targetMemoryUtilizationPercentage: 75
  # Make HPA reactive enough to actually scale inside a 5-minute load test.
  # Default scaleUp stabilization is 0s but the policies are conservative
  # (15% per 60s); we override with a 30s window + a 100%/30s policy so
  # replicas can double quickly when CPU spikes during ramp.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1654              # matches the chiseled .NET image's APP_UID
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsUser: 1654
  capabilities:
    drop: [ALL]

# livenessProbe:
#   httpGet:
#     path: /healthz
#     port: http
#   initialDelaySeconds: 10
#   periodSeconds: 15
#   failureThreshold: 3
# readinessProbe:
#   httpGet:
#     path: /ready
#     port: http
#   initialDelaySeconds: 5
#   periodSeconds: 10
#   failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# -- OpenTelemetry / Azure Monitor.
#    The application ships telemetry to Application Insights via the
#    `Azure.Monitor.OpenTelemetry.Exporter` ingest path (activated when
#    secrets.appInsightsConnectionString is non-empty). The previous OTLP
#    exporter that POSTed to a co-located OTel collector has been removed
#    — see fix/drop-otlp-exporter-faulted-deps in the changelog — so the
#    `observability.otlp.*` block is gone. If you need to ship to a side-
#    car collector again, re-add it here AND wire the OTLP exporter back
#    into ObservabilityConfig.cs alongside the AzureMonitor exporters.
observability:
  # OpenTelemetry `service.namespace` resource attribute. Application Insights
  # derives the Cloud-role-name on the App Map as `<namespace>.<service.name>`
  # — leaving this empty collapses every service in the workspace to a single
  # node. service.instance.id is set per-pod via the downward API in the
  # Deployment template (no values knob needed).
  serviceNamespace: "hex-scaffold"
  # Tornadoes the four golden signals (latency/traffic/errors/saturation)
  # into the Application Insights "customMetrics" table via the runtime and
  # HTTP/ASP.NET Core instrumentations that are wired in code.

  # OTel TracerProvider sampler. ParentBased(TraceIdRatio) — root traces
  # sampled at this ratio, children inherit the parent's decision. 1.0 = full
  # fidelity (production default); the aks-test loadtest overlay drops it to
  # 0.1 to keep AI ingest under the cap.
  sampling:
    tracesRatio: 1.0
  # Serilog level overlay. Defaults match production. The loadtest overlay
  # lowers root to Warning (per-event LogInformation in repositories blows
  # the AI cap) but keeps the consumer at Information so failures stay visible.
  logging:
    rootLevel: Information
    overrides:
      "Hex.Scaffold.Adapters.Inbound.Messaging.AccountEventConsumer": Information

# Classic Microsoft.ApplicationInsights.AspNetCore SDK knobs. The classic SDK
# drives Live Metrics (QuickPulse) and has its own sampling stage independent
# of the OTel TracerProvider above. The default 5 items/s is the framework
# default; the aks-test loadtest overlay raises this to 50 so per-pod
# QuickPulse capacity matches the 8-pod / 24k events-per-second Platinum tier.
classicSdk:
  maxTelemetryItemsPerSecond: 5
