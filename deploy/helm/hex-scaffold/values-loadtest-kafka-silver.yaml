# ---------------------------------------------------------------------------
# Per-tier loadtest overlay — Silver
#
# Plan reference: .omc/plans/kafka-loadtest-plan.md §5.2.
#
# Pinned consumer count + resources (HPA explicitly OFF) so tier comparisons
# are not contaminated by mid-run scale events. Combined at install time
# with values-aks-test-loadtest.yaml + the per-run --set / --set-string flags.
# ---------------------------------------------------------------------------

replicaCount: 2

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Critical: HPA must be off, otherwise consumer pods scale mid-run and
# contaminate the tier comparison. See plan §5.2 critic Finding #11.
autoscaling:
  enabled: false

kafka:
  # Phase 5 v2 — Silver: feed the batched-write consumer enough records per
  # poll to keep the bulk-write path warm. 200 records × 50 ms linger
  # comfortably matches the 400 events/s target (200 = 0.5 s of arrivals).
  # batchSize/batchLingerMs use the chart defaults (200 / 50 ms) so this
  # tier doesn't need explicit overrides.
  maxPollRecords: 200
  fetchMinBytes: 32768
