apiVersion: v2
name: hex-scaffold-umbrella
description: |
  Golden-path deploy unit — deploys hex-scaffold TOGETHER WITH its data infra
  provisioned from the platform building blocks, as ONE unit. Meant to be
  deployed by ArgoCD as a single Application (the orchestrator resolves this
  chart by version and creates the Application; see ADR-0008). Ordering is by
  ArgoCD sync-wave: the SQL building block reconciles in the infra wave, then
  hex-scaffold's migration Sync hook, then the app.

  Defaults to azure-flexibleserver (ADR-0020), so installing this BILLS. The
  wave gate depends on the platform.myorg.io health check registered by
  aks-foundation, because ArgoCD cannot assess a Crossplane XR on its own.
type: application
# 0.2.0 is BREAKING: the SQL building block's default engine flipped from
# in-cluster CloudNativePG to a billed Azure Flexible Server (ADR-0020), and the
# app's bind moved from one literal-host Secret to two composed Secrets (G-T6).
#
# 0.3.0 is NOT breaking: the bind block collapsed from four secretKeyRefs to the
# single hex-scaffold 0.3.0 `instanceName` knob. Same Secrets, same keys, same
# rendered output — one fact instead of five copies of it.
#
# 0.4.0 IS breaking for anyone holding a values overlay: the application subchart
# is aliased `app`, so `hex-scaffold.replicaCount` becomes `app.replicaCount`.
#
# What this does to an EXISTING release, measured by diffing the render rather
# than reasoned about:
#   * no object is renamed — `nameOverride` in values.yaml cancels the alias
#     reaching `.Chart.Name`, which on its own turned `<app>` into `<app>-app`
#     and would have made ArgoCD delete and recreate the Deployment/Service/Job;
#   * spec.selector.matchLabels is UNCHANGED (it is built from
#     app.kubernetes.io/name, which honours nameOverride), so the immutable field
#     does not move and `helm upgrade` applies cleanly;
#   * the `helm.sh/chart` label, the container name, and the config/secret
#     checksum annotations DO change, so pods roll once.
# One rolling restart, no recreate, no data touched.
version: 0.4.0
appVersion: "latest"
kubeVersion: ">=1.27.0"

dependencies:
  # The application. Local path — this umbrella ships inside the app repo
  # (rendered from the net-hexagonal template), so the app's own CI packages it.
  #
  # ALIASED `app`, and the alias is the whole point. Helm keys a subchart's
  # values by its alias when it has one and by its chart name otherwise — and
  # this chart's NAME is an identity token the scaffolder rewrites, so without an
  # alias a scaffolded app's values live under `orders-v3:` while the template's
  # live under `hex-scaffold:`. Nothing outside the chart can then address the
  # application by a fixed path: the platform's tunable allowlist is static
  # configuration and cannot enumerate the names of apps that do not exist yet.
  # The alias makes `app.*` the address for every chart rendered from this
  # template, forever.
  #
  # Values addressed to a subchart key that does not exist are DISCARDED BY HELM
  # WITHOUT AN ERROR, so every symptom of getting this wrong is silent.
  - name: hex-scaffold
    alias: app
    version: "0.3.0"
    repository: "file://../helm/hex-scaffold"

  # The SQL building block. Resolved from the platform OCI registry. Aliased to
  # `sqldatabase` so values + the enable condition read `sqldatabase.*`. It
  # transitively depends on plat-eng-commons-package from the same registry.
  #
  # 0.2.0 is where `engine` appears; 0.1.0 was CloudNativePG-only and its values
  # shape (top-level user/password/instances/storage) is rejected by 0.2.0.
  #
  # No cache building block here: it still emits a retired Azure API through a
  # provider group this cluster does not serve, and bypasses the RedisInstance
  # XRD. It joins once ADR-0019's re-point lands.
  - name: plat-eng-sql-database-package
    alias: sqldatabase
    version: "0.2.0"
    repository: "oci://ghcr.io/lurodrisilva/helm-charts"
    condition: sqldatabase.enabled
