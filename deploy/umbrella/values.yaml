# ---------------------------------------------------------------------------
# hex-scaffold-umbrella / values.yaml
#
# ONE name, stated twice: sqldatabase.databases.sql[0].name and
# hex-scaffold.postgres.bindBuildingBlock.instanceName (example: "acct"). It names
# the PostgresInstance XR, and hex-scaffold 0.3.0 derives every Secret ref the
# control plane composes off it — <name>-postgres-conn and <name>-admin-password.
# Keep the two in sync; nothing else in this file repeats the name.
#
# The orchestrator (ADR-0008) supplies these per-instance values and resolves
# this chart by version; it does not edit the chart.
#
# THIS CHART BILLS. engine defaults to azure-flexibleserver (ADR-0020), so
# installing this umbrella provisions a real Azure Database for PostgreSQL
# Flexible Server — ~$140/mo, the figure observed on aks-test. For a free
# in-cluster database set sqldatabase.engine=cloudnativepg and switch the bind
# block to its literal form (documented below).
# ---------------------------------------------------------------------------

# --- Infra wave: Postgres from the SQL building block. -----------------------
# Renders a PostgresInstance XR at the default sync-wave (0), which the control
# plane fulfils on Azure. Two things gate the next wave, and BOTH are needed:
#
#   * the platform.myorg.io health check aks-foundation registers with ArgoCD —
#     without it ArgoCD cannot assess a Crossplane XR, defaults it to Healthy,
#     and releases wave 1 against a server that will not exist for 5–10 min;
#   * hex-scaffold's wait initContainer (G-T7), the in-pod backstop that holds
#     even when cluster config does not.
sqldatabase:
  enabled: true
  team: platform
  environment: production
  # The paved road (ADR-0020). Set to cloudnativepg for dev / CI / ephemeral.
  engine: azure-flexibleserver
  databases:
    sql:
      - name: acct               # -> XR acct, Secrets acct-postgres-conn + acct-admin-password
        azureFlexibleServer:
          # small | medium | large. The enum IS the guardrail — the Composition
          # maps it to an Azure SKU, and there is no skuName knob (ADR-0020).
          size: small
          version: "16"
          storageMb: 32768
          databaseName: acct-db
        # No `user` / `password` here. Under azure-flexibleserver the admin login
        # is platform-fixed and the password is generated by the Crossplane
        # provider straight into acct-admin-password — this control plane never
        # holds a credential. Setting either key fails the render rather than
        # leaving a dead knob that reads as live.

# --- App waves: hex-scaffold, bound to the building block. --------------------
hex-scaffold:
  # Order with ArgoCD sync-waves (migration wave 1, app wave 2) so both land
  # after the infra wave (0). See hex-scaffold values.yaml `argo`.
  argo:
    enabled: true
    syncWave:
      migration: "1"
      app: "2"

  features:
    inbound: rest
    outbound: rest
    persistence: postgres
    redis: false               # cache building block is Azure-managed (G-T3) — Day-2

  # Bind to the control plane's composed connection Secrets (G-T6). Every field
  # resolves at pod start: the private FQDN does not exist until Crossplane has
  # provisioned the server, so it cannot be a literal here.
  #
  # TWO Secrets, because the contract is engine-specific (ADR-0020). The
  # Composition writes host/username/dbname into <name>-postgres-conn; the
  # password is generated by the provider into <name>-admin-password. Nothing
  # merges them — a Secret cannot reference another Secret, and the password does
  # not exist until the provider makes it. This bind is what bridges them.
  #
  # instanceName is the SAME value as sqldatabase.databases.sql[0].name above —
  # that is the whole point of it. hex-scaffold 0.3.0 derives all four refs from
  # it, so the database name and the bind are one fact instead of five copies of
  # one. Five copies is not a style problem: the XR name and the refs are
  # independent values, so a rename that misses one yields an app waiting forever
  # on a Secret nothing will ever create.
  #
  # Under cloudnativepg, drop instanceName and use the literal form instead
  # (setting both is rejected — the two engines have no shared contract):
  #     secretName: acct-secret
  #     host: acct-rw
  #     database: acct-db
  postgres:
    bindBuildingBlock:
      enabled: true
      instanceName: acct

  migrations:
    enabled: true              # Sync hook (wave 1) runs against the Flexible Server

  wiremock:
    enabled: false             # not needed for the create+deploy proof

  secrets:
    appInsightsConnectionString: ""   # G-T4 partial: disable Azure Monitor export
