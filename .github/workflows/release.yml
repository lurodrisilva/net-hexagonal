name: release

# Builds a multi-arch container image AND packages the umbrella deploy unit
# (ADR-0008), publishing both to GHCR with SLSA build-provenance attestations.
#
# Triggers:
#   pull_request → build + Dockerfile lint + chart validation, NO push
#   push to main → build + push image (`edge`/sha/`latest`) + push umbrella
#                  <base>-<sha> prerelease
#   tag v*.*.*   → build + push image (semver + `latest`) + push umbrella <semver>
#
# Registry is GHCR, not ACR, despite ADR-0014 naming ACR: the ACR exists and the
# kubelet has AcrPull, but nothing can authenticate to it — CI has no push
# identity and ArgoCD has no OCI pull credential, and the registry allows
# neither anonymous nor admin access. GHCR needs neither (push via GITHUB_TOKEN,
# pull anonymous). See ADR-0021; ACR is gated on its private-endpoint work.
#
# Security posture (see .claude/skills/github-actions):
#   * permissions: {} at workflow floor, widened per job only where needed
#   * every third-party action SHA-pinned with tag comment
#   * GHCR auth via short-lived GITHUB_TOKEN (no long-lived PAT)
#   * build-provenance attestation attached to every pushed image digest
#   * untrusted/dynamic values pass through env:, never interpolated into run:

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'src/**'
      - 'deploy/helm/**'
      - 'deploy/umbrella/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'Hex.Scaffold.slnx'
      - 'global.json'
      - '.github/workflows/release.yml'
  push:
    branches: [master, main]
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The platform OCI registry — where the SQL building block lives and where the
  # umbrella is published alongside it.
  CHART_REPO: oci://ghcr.io/lurodrisilva/helm-charts
  UMBRELLA_DIR: deploy/umbrella

jobs:
  # Chart validation. The repo had none before Phase D: release.yml built the
  # image and never looked at deploy/, so a chart that could not render still
  # shipped a green build.
  validate-charts:
    name: lint + render charts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Resolve umbrella dependencies
        run: helm dependency update "$UMBRELLA_DIR"

      - name: Lint
        run: |
          helm lint deploy/helm/hex-scaffold
          helm lint "$UMBRELLA_DIR"

      - name: Render the umbrella (default = azure-flexibleserver)
        run: |
          helm template acct "$UMBRELLA_DIR" > /tmp/umbrella.yaml
          # The default engine bills, so assert the deploy unit is what we think:
          # one PostgresInstance XR, and no credential in the rendered output.
          grep -q 'kind: PostgresInstance' /tmp/umbrella.yaml
          test "$(grep -c 'kind: PostgresInstance' /tmp/umbrella.yaml)" = "1"
          # The CNPG engine must stay inert under the default.
          if grep -q 'kind: Cluster' /tmp/umbrella.yaml; then
            echo "::error::umbrella rendered a CNPG Cluster under engine=azure-flexibleserver" && exit 1
          fi

      - name: Assert the app binds the database the umbrella actually provisions
        run: |
          # The invariant this deploy unit lives or dies on: the app's bind must
          # point at the Secrets composed off the PostgresInstance the umbrella
          # renders. The XR name and the bind are separate values in values.yaml,
          # so nothing but this check stops them drifting apart — and the failure
          # mode is silent. The app comes up, waits forever on a Secret nothing
          # will ever create, and the only symptom is a pod that never goes Ready.
          #
          # Asserted on the RENDER, not on values.yaml, so it holds no matter who
          # wrote the values — this chart, the scaffolder, or the orchestrator
          # baking them in at compose time.
          xr="$(yq -r 'select(.kind == "PostgresInstance") | .metadata.name' /tmp/umbrella.yaml | head -1)"
          if [ -z "$xr" ]; then
            echo "::error::no PostgresInstance rendered — cannot verify the bind" && exit 1
          fi
          echo "PostgresInstance: ${xr}"
          for secret in "${xr}-postgres-conn" "${xr}-admin-password"; do
            if ! grep -q "name: \"${secret}\"" /tmp/umbrella.yaml; then
              echo "::error::the app does not bind ${secret} — the bind has drifted from the XR name ${xr}" && exit 1
            fi
          done
          # And nothing may bind a *different* instance's Secrets.
          if grep -oE '[a-z0-9-]+-(postgres-conn|admin-password)' /tmp/umbrella.yaml \
               | sort -u | grep -vE "^${xr}-(postgres-conn|admin-password)$"; then
            echo "::error::the umbrella binds Secrets belonging to an instance other than ${xr}" && exit 1
          fi
          echo "the app binds exactly the database the umbrella provisions"

      - name: Assert no plaintext credential renders
        run: |
          # Every credential must arrive by secretKeyRef and reach the app through
          # $(VAR) expansion at container start. Two independent assertions:
          #
          #   1. the connection string never carries a literal password;
          #   2. no manifest holds a `password: <value>` line at all.
          #
          # (2) is what the pre-0.2.0 umbrella would have failed — it shipped
          # `password: CHANGE_ME` in values.yaml.
          #
          # shellcheck disable=SC2016
          # The single quotes are deliberate: $(PGPASSWORD) is the literal text
          # we require in the manifest — the kubelet expands it at container
          # start, not this shell.
          if ! grep -q 'Password=\$(PGPASSWORD)' /tmp/umbrella.yaml; then
            echo "::error::connection string does not use \$(PGPASSWORD) expansion" && exit 1
          fi
          if grep -nE '^[[:space:]]*password:[[:space:]]*\S' /tmp/umbrella.yaml; then
            echo "::error::a plaintext password rendered into the umbrella" && exit 1
          fi
          echo "no plaintext credential in the rendered umbrella"

      - name: Render hex-scaffold in literal (cloudnativepg) bind mode
        run: |
          # G-T6 keeps the pre-0.2.0 static-host mode working. Prove it renders,
          # so the CNPG path is not silently broken by the azure default.
          helm template acct deploy/helm/hex-scaffold \
            --set postgres.bindBuildingBlock.enabled=true \
            --set postgres.bindBuildingBlock.secretName=acct-secret \
            --set postgres.bindBuildingBlock.host=acct-rw \
            --set postgres.bindBuildingBlock.database=acct-db > /dev/null

      - name: Assert the bind fails closed when under-specified
        run: |
          # An enabled bind with no host must NOT render. If this stops failing,
          # the guard is gone and a broken connection string ships silently.
          if helm template acct deploy/helm/hex-scaffold \
               --set postgres.bindBuildingBlock.enabled=true \
               --set postgres.bindBuildingBlock.secretName=acct-secret \
               --set postgres.bindBuildingBlock.database=acct-db > /dev/null 2>&1; then
            echo "::error::bindBuildingBlock rendered without a host — the fail-closed guard is gone" && exit 1
          fi
          echo "bind fails closed without a host, as intended"

      - name: Assert instanceName derives all four building-block refs
        run: |
          # One knob must fan out to the four Secret refs the SQL building block
          # composes. The XR name and these refs are otherwise independent values
          # restating one fact, and a rename that misses one yields an app waiting
          # forever on a Secret nothing will create.
          helm template acct deploy/helm/hex-scaffold \
            --set postgres.bindBuildingBlock.enabled=true \
            --set postgres.bindBuildingBlock.instanceName=orders-v3 \
            --set migrations.enabled=true \
            --set migrations.wait.enabled=true > /tmp/bind-derived.yaml

          # host/username/dbname come from <instance>-postgres-conn; the
          # provider-generated password from <instance>-admin-password.
          for pair in 'orders-v3-postgres-conn:host' \
                      'orders-v3-postgres-conn:username' \
                      'orders-v3-postgres-conn:dbname' \
                      'orders-v3-admin-password:password'; do
            secret="${pair%%:*}"; key="${pair##*:}"
            if ! grep -A1 "name: \"${secret}\"" /tmp/bind-derived.yaml | grep -q "key: \"${key}\""; then
              echo "::error::instanceName did not derive ${secret} -> ${key}" && exit 1
            fi
          done

          # The migration Job's wait initContainer (G-T7) takes PGHOST from the
          # SAME resolver. If the derivation is ever applied where the refs are
          # read instead of once up front, this container silently regresses to an
          # empty literal host — a bind that is syntactically fine and wrong.
          if ! awk '/name: wait-for-db/,/WAIT_TIMEOUT/' /tmp/bind-derived.yaml \
               | grep -A3 'name: PGHOST' | grep -q 'secretKeyRef'; then
            echo "::error::the wait initContainer's PGHOST is not a secretKeyRef — the shared resolver regressed" && exit 1
          fi

          # Credentials must never reach the wait container.
          if awk '/name: wait-for-db/,/WAIT_TIMEOUT/' /tmp/bind-derived.yaml | grep -q 'PGPASSWORD'; then
            echo "::error::the wait initContainer was handed a credential" && exit 1
          fi
          echo "instanceName derives all four refs; the wait initContainer shares the resolver"

      - name: Assert mixing instanceName with cloudnativepg literals fails closed
        run: |
          # instanceName derives the azure-flexibleserver Secret layout; the
          # literals are the cloudnativepg one. No contract spans both (ADR-0020),
          # so setting both is ambiguous and must not render.
          if helm template acct deploy/helm/hex-scaffold \
               --set postgres.bindBuildingBlock.enabled=true \
               --set postgres.bindBuildingBlock.instanceName=orders-v3 \
               --set postgres.bindBuildingBlock.host=acct-rw > /dev/null 2>&1; then
            echo "::error::instanceName + a literal host rendered — the engine-mixing guard is gone" && exit 1
          fi
          echo "mixing instanceName with a literal fails closed, as intended"

      - name: Assert a scaffolded app gets a database and an image of its own
        run: |
          # The scaffolder's identity substitution is PascalCase/kebab and cannot
          # reach the database name, so without an explicit rewrite every
          # scaffolded app provisions an Azure server called acct-<random>. That
          # is not hypothetical: aks-test currently runs orders-v4 against
          # acct-6584520516bb.
          #
          # Asserted on the RENDER rather than on values.yaml, because the render
          # is what reaches the cluster — and because `acct` legitimately remains
          # in this repo's comments and in deploy/argocd/*.example.yaml, so a
          # "no acct anywhere" check would either fail or force gutting docs.
          DB_SIZE=medium DB_VERSION=15 DB_STORAGE_MB=65536 \
          IMAGE_REPOSITORY=ghcr.io/example-org/orders-ci-ab12 \
            bash scripts/scaffold-render.sh . /tmp/scaffolded OrdersCi orders-ci
          helm dependency update /tmp/scaffolded/deploy/umbrella >/dev/null
          helm template orders-ci /tmp/scaffolded/deploy/umbrella > /tmp/scaffolded.yaml

          xr="$(yq -r 'select(.kind == "PostgresInstance") | .metadata.name' /tmp/scaffolded.yaml | head -1)"
          [ "$xr" = "orders-ci" ] || { echo "::error::scaffolded XR is '$xr', expected 'orders-ci'" && exit 1; }

          # databaseName is dropped by the render so the building block derives it.
          db="$(yq -r 'select(.kind == "PostgresInstance") | .spec.databaseName' /tmp/scaffolded.yaml | head -1)"
          [ "$db" = "orders-ci-db" ] || { echo "::error::scaffolded databaseName is '$db', expected 'orders-ci-db'" && exit 1; }

          # Sizing must survive the scaffold, or the wizard's choices are decoration.
          for pair in 'size:medium' 'version:15' 'storageMb:65536'; do
            k="${pair%%:*}"; want="${pair##*:}"
            got="$(yq -r "select(.kind == \"PostgresInstance\") | .spec.${k}" /tmp/scaffolded.yaml | head -1)"
            [ "$got" = "$want" ] || { echo "::error::scaffolded spec.${k} is '$got', expected '$want'" && exit 1; }
          done

          # Nothing anywhere in the scaffolded render may still bind the template's
          # sample instance — that is the whole failure this rewrite exists to stop.
          if grep -oE '\bacct-(postgres-conn|admin-password|db)\b' /tmp/scaffolded.yaml | sort -u | grep .; then
            echo "::error::the scaffolded app still references the template's acct database" && exit 1
          fi

          # ...and the same class of leak one layer over: the image repository is
          # a plain values default naming THIS repository, so it is invisible to
          # the identity substitution and rides into every scaffolded app. A
          # scaffolded app that deploys the template's image is not the app the
          # developer asked for, and once release CI pins the new app's digest
          # onto that repository the reference stops resolving at all.
          if grep -q 'net-hexagonal' /tmp/scaffolded.yaml; then
            echo "::error::the scaffolded render still references the template repository" && exit 1
          fi
          # Process substitution, not a pipe: an `exit 1` inside a piped loop
          # runs in a subshell and would leave the step green.
          while IFS= read -r img; do
            case "$img" in
              ghcr.io/*)
                [ "$img" = "ghcr.io/example-org/orders-ci-ab12:latest" ] || {
                  echo "::error::scaffolded render pulls '$img', expected ghcr.io/example-org/orders-ci-ab12:latest"
                  exit 1; } ;;
              *) ;;   # busybox / wiremock sidecars are not app images
            esac
          done < <(grep -oE 'image: "?[^"[:space:]]+' /tmp/scaffolded.yaml | sed -E 's/^image: "?//' | sort -u)
          echo "scaffolded app provisions orders-ci / orders-ci-db (medium/15/65536) and runs its own image"

      - name: Assert the app subchart is addressable as `app` and renders unchanged
        run: |
          set -euo pipefail
          # The alias is what makes the application addressable by a FIXED path
          # from outside the chart. Its own name is an identity token the
          # scaffolder rewrites, so without the alias the platform's static
          # allowlist would have to enumerate app names that do not exist yet.
          got="$(yq -r '.dependencies[] | select(.repository | test("^file://")) | .alias // .name' deploy/umbrella/Chart.yaml)"
          [ "$got" = "app" ] || { echo "::error::the app subchart resolves to values key '$got', expected 'app'" && exit 1; }

          # Aliasing sets the subchart's .Chart.Name to the alias, and the
          # fullname helper is built from it — so the alias alone renamed every
          # workload (orders-v3 -> orders-v3-app). nameOverride cancels that, and
          # this asserts it: a rename here means ArgoCD deleting and recreating a
          # live app's Deployment, Service and Job.
          helm dependency update deploy/umbrella >/dev/null
          helm template hex-scaffold deploy/umbrella > /tmp/aliased.yaml
          for want in hex-scaffold hex-scaffold-migrate hex-scaffold-sqldatabase; do
            grep -qE "^  name: ${want}$" /tmp/aliased.yaml \
              || { echo "::error::expected a rendered object named '${want}'; the alias leaked into object names" && exit 1; }
          done
          if grep -qE '^  name: hex-scaffold-app' /tmp/aliased.yaml; then
            echo "::error::the alias reached .Chart.Name — nameOverride is not compensating" && exit 1
          fi

          # spec.selector.matchLabels is IMMUTABLE on an existing Deployment. It
          # is built from app.kubernetes.io/name, which honours nameOverride —
          # assert it, because this is the one difference that would turn an
          # upgrade into a delete-and-recreate.
          sel="$(yq -r 'select(.kind == "Deployment") | .spec.selector.matchLabels["app.kubernetes.io/name"]' /tmp/aliased.yaml | head -1)"
          [ "$sel" = "hex-scaffold" ] || { echo "::error::Deployment selector name is '$sel', expected 'hex-scaffold' — the alias reached an immutable field" && exit 1; }
          echo "app subchart is addressable as 'app'; object names and the Deployment selector are unchanged"

      - name: Assert an explicit ref still overrides the derivation
        run: |
          # The derivation is a default, not a cage: an unusual Secret layout must
          # stay expressible without abandoning instanceName for the other three.
          helm template acct deploy/helm/hex-scaffold \
            --set postgres.bindBuildingBlock.enabled=true \
            --set postgres.bindBuildingBlock.instanceName=orders-v3 \
            --set postgres.bindBuildingBlock.hostFrom.name=custom-conn \
            --set postgres.bindBuildingBlock.hostFrom.key=fqdn > /tmp/bind-override.yaml
          grep -q 'name: "custom-conn"' /tmp/bind-override.yaml \
            || { echo "::error::an explicit hostFrom did not override the derivation" && exit 1; }
          grep -q 'name: "orders-v3-admin-password"' /tmp/bind-override.yaml \
            || { echo "::error::overriding one ref discarded the other derived refs" && exit 1; }
          echo "explicit refs win; the remaining refs stay derived"

  build-and-push:
    name: build + publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read      # checkout
      packages: write     # push to ghcr.io
      id-token: write     # mint Sigstore OIDC token for attestation
      attestations: write # write the attestation to the repo
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tags:   ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (multi-arch emulation for non-native builders)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels (OCI + semver)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is applied on every GHCR push (master/main + semver tags),
          # never on PRs (which do not push). flavor: latest=false disables the
          # action's default semver-only auto-latest so the rule above is the
          # single source of truth.
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=edge,branch=master
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}

      - name: Lint the Dockerfile (BuildKit --call=check)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          call: check

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # PRs build only (no push); branch/tag pushes go to GHCR.
          push: ${{ github.event_name != 'pull_request' }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build-provenance attestation only persists on repos GitHub supports for it
      # (public repos, or org-owned repos). A user-owned PRIVATE repo — which every
      # scaffold is (scaffold-new-app.yml creates `--private`) — makes the attest API
      # fail with "Feature not available for user-owned private repositories". Gate on
      # visibility so private scaffolds go green without provenance; public/promoted
      # repos still get it.
      - name: Attest build provenance (SLSA v1)
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Job summary
        if: always()
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS:   ${{ steps.meta.outputs.tags }}
          PUSHED: ${{ github.event_name != 'pull_request' }}
        run: |
          {
            echo "## Release build"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`  Ref: \`${{ github.ref }}\`"
            echo "- Pushed to registry: \`$PUSHED\`"
            echo "- Digest: \`${DIGEST:-<not-pushed>}\`"
            echo ""
            echo "### Tags"
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
            if [ "$PUSHED" = "true" ]; then
              echo ""
              echo "Verify locally:"
              echo '```bash'
              echo "gh attestation verify oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST} -R ${{ github.repository }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Phase D's DoD: package the umbrella and publish it BY DIGEST.
  #
  # The umbrella is the deploy unit the orchestrator resolves by version
  # (ADR-0008). Pinning the image digest here is what makes that resolution
  # reproducible: chart version X always deploys exactly one image, with no
  # mutable tag in between. That is why this job depends on build-and-push —
  # it needs the digest that build produced.
  package-umbrella:
    name: package + publish umbrella
    runs-on: ubuntu-latest
    needs: build-and-push
    # PRs validate charts (see validate-charts) but must never publish.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Resolve the chart version
        id: version
        env:
          # github.ref_name is a tag or branch name. Never interpolated into a
          # shell command — read from the environment and pattern-matched.
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="$(yq '.version' "$UMBRELLA_DIR/Chart.yaml")"
          if [ "$REF_TYPE" = "tag" ]; then
            # v1.2.3 -> 1.2.3. A release is the clean SemVer.
            CHART_VERSION="${REF_NAME#v}"
            APP_VERSION="${REF_NAME#v}"
          else
            # Master builds publish a SemVer PRERELEASE off the chart's declared
            # base: 0.2.0-sha-abc1234. Prerelease ordering keeps these below the
            # eventual 0.2.0 release, which is what we want — `helm search` and
            # version ranges must not prefer a master build over a tag.
            #
            # The `sha-` prefix is load-bearing, not decoration. A bare short SHA
            # that happens to be all digits with a leading zero (~1 commit in
            # 270) is an invalid SemVer numeric identifier, and helm rejects it:
            # `0.2.0-0123456` -> "Error: version segment starts with 0". The
            # prefix makes the identifier alphanumeric, which is always legal.
            SHORT_SHA="$(printf '%s' "$SHA" | cut -c1-7)"
            CHART_VERSION="${BASE}-sha-${SHORT_SHA}"
            APP_VERSION="${SHORT_SHA}"
          fi
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved chart version: ${CHART_VERSION} (base ${BASE})"

      - name: Pin the image into the umbrella
        id: pin
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST:-}" ]; then
            echo "::error::build-and-push produced no digest — refusing to publish an unpinned umbrella"
            exit 1
          fi
          # WHERE the image lives is pinned alongside WHICH image it is, and the
          # first half is not redundant. `image.repository` is an ordinary values
          # default — ghcr.io/<owner>/net-hexagonal in this repo — and
          # scaffold-render.sh substitutes IDENTITY TOKENS, of which this
          # repository's own name is not one. A scaffolded app therefore inherits
          # the template's repository, and pinning only the digest publishes
          # ghcr.io/<owner>/net-hexagonal@sha256:<the scaffolded app's digest>:
          # a real digest in the wrong repository, so the registry answers
          # "manifest unknown" and the pod never starts. Every build signal stays
          # green, which is what made it survive this long.
          #
          # github.repository is whichever repo's CI is running — this template's
          # or a scaffolded app's — so one expression is correct for both and
          # cannot drift. Lowercased because GHCR rejects an uppercase path
          # segment while GitHub preserves the owner's casing.
          IMAGE="$(printf '%s/%s' "$REGISTRY" "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          # Both the app and the migration Job run the same image; the migration
          # bundle is baked into it. digest wins over tag in the chart helpers.
          # `.app` is the subchart's ALIAS, so these paths are stable in this
          # repo and in every app scaffolded from it. They used to be
          # `.hex-scaffold`, which the scaffolder rewrites to the app's own name.
          DIGEST="$DIGEST" IMAGE="$IMAGE" yq -i '
            .app.image.repository = strenv(IMAGE) |
            .app.image.digest = strenv(DIGEST) |
            .app.migrations.image.repository = strenv(IMAGE) |
            .app.migrations.image.digest = strenv(DIGEST)
          ' "$UMBRELLA_DIR/values.yaml"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Pinned image: ${IMAGE}@${DIGEST}"

      - name: Resolve umbrella dependencies
        run: helm dependency update "$UMBRELLA_DIR"

      - name: Assert the umbrella renders the pinned image
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          IMAGE: ${{ steps.pin.outputs.image }}
        run: |
          set -euo pipefail
          helm template acct "$UMBRELLA_DIR" > /tmp/pinned.yaml
          # Publishing a chart that does not actually reference the image would
          # defeat the entire point, so prove it rather than trust the patch.
          # Asserted as the WHOLE reference: "@${DIGEST}" alone passed happily
          # while the repository in front of it belonged to another repo, which
          # is the exact failure that shipped.
          if ! grep -q "${IMAGE}@${DIGEST}" /tmp/pinned.yaml; then
            echo "::error::rendered umbrella does not reference ${IMAGE}@${DIGEST}" && exit 1
          fi
          # ...and prove no mutable tag survived on the app image.
          if grep -qE 'image: "?ghcr\.io/[^"@]*:latest"?' /tmp/pinned.yaml; then
            echo "::error::umbrella still references a mutable :latest tag" && exit 1
          fi
          # ...and that NO ghcr.io image points anywhere but at this build. A
          # second, wrong-but-plausible reference is invisible to the checks
          # above, because both are satisfied by the one correct reference.
          if grep -oE 'image: "?ghcr\.io/[^"[:space:]]+' /tmp/pinned.yaml \
               | sed -E 's/^image: "?//' | sort -u | grep -v "^${IMAGE}@${DIGEST}$" | grep .; then
            echo "::error::the umbrella references a ghcr.io image other than ${IMAGE}@${DIGEST}" && exit 1
          fi
          echo "umbrella renders ${IMAGE}@${DIGEST} and nothing else from ghcr.io"

      - name: Package
        id: package
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package "$UMBRELLA_DIR" \
            --version "$CHART_VERSION" \
            --app-version "$APP_VERSION" \
            --destination dist
          echo "path=dist/hex-scaffold-umbrella-${CHART_VERSION}.tgz" >> "$GITHUB_OUTPUT"

      # Two logins, because they write to different places and two different
      # tools read them:
      #
      #   helm registry login   -> ~/.config/helm/registry/config.json  (helm push)
      #   docker/login-action   -> ~/.docker/config.json                (attest,
      #                            which needs registry creds for push-to-registry)
      #
      # Doing only the helm login publishes the chart fine and then fails the
      # attestation with "No credentials found for registry ghcr.io".
      - name: Log in to GHCR (Docker config — for the attestation push)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (Helm OCI)
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | helm registry login "$REGISTRY" --username "$ACTOR" --password-stdin

      - name: Push umbrella to GHCR
        id: push_chart
        env:
          CHART_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          # `helm push` prints the pushed manifest digest on stderr.
          helm push "$CHART_PATH" "$CHART_REPO" 2>&1 | tee /tmp/push.log
          CHART_DIGEST="$(grep -oE 'sha256:[0-9a-f]{64}' /tmp/push.log | head -1)"
          echo "chart_digest=${CHART_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Umbrella digest: ${CHART_DIGEST}"

      # Same visibility gate as the image attestation above: the attest API fails on
      # user-owned private repos, so skip provenance there (chart still publishes).
      - name: Attest umbrella provenance (SLSA v1)
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/lurodrisilva/helm-charts/hex-scaffold-umbrella
          subject-digest: ${{ steps.push_chart.outputs.chart_digest }}
          push-to-registry: true

      - name: Job summary
        if: always()
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
          CHART_DIGEST:  ${{ steps.push_chart.outputs.chart_digest }}
          IMAGE_DIGEST:  ${{ needs.build-and-push.outputs.digest }}
        run: |
          {
            echo "## Umbrella deploy unit"
            echo ""
            echo "- Chart: \`${CHART_REPO}/hex-scaffold-umbrella\`"
            echo "- Version: \`${CHART_VERSION}\`"
            echo "- Chart digest: \`${CHART_DIGEST:-<not-pushed>}\`"
            echo "- Pinned image digest: \`${IMAGE_DIGEST:-<none>}\`"
            echo ""
            echo "Resolve it:"
            echo '```bash'
            echo "helm show chart ${CHART_REPO}/hex-scaffold-umbrella --version ${CHART_VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
