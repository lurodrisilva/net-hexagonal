# =============================================================================
# scaffold-new-app.yml — the ADR-0009 golden-path "create" scaffolder.
#
# WHAT THIS IS
#   A workflow_dispatch workflow that renders THIS net-hexagonal template (the
#   concrete "Hex.Scaffold" service) into a BRAND-NEW GitHub repository for a
#   requested application. It is the "create" half of the golden path and is
#   kept DELIBERATELY OUTSIDE the platform orchestrator (ADR-0009): the
#   orchestrator's POST /api/v1/apps dispatches this workflow; the render + repo
#   creation + push all happen here on GitHub Actions, not in orchestrator code.
#
# HOW IT AUTHENTICATES
#   It mints a short-lived installation token from a GitHub App. The App's
#   credentials live in this repo's Actions secrets:
#       SCAFFOLDER_APP_ID           — the GitHub App's numeric app id
#       SCAFFOLDER_APP_PRIVATE_KEY  — the App's PEM private key
#   This is the SAME GitHub App the orchestrator uses to dispatch this workflow
#   (see the harness "Phase F" proof doc + docs/scaffolder.md). The App must be
#   installed on `owner` with permission to create repositories and push code.
#
# WHAT IT DOES NOT DO
#   The render is heuristic (sed-based; see scripts/scaffold-render.sh). It does
#   NOT rename the sample DOMAIN ("account") — the scaffolded app keeps the
#   reference domain. A real template engine + domain-rename is a documented
#   follow-up (docs/scaffolder.md). The `domain` input below is accepted and
#   recorded for that future step but does not yet drive substitution.
# =============================================================================
name: scaffold-new-app

on:
  workflow_dispatch:
    inputs:
      appName:
        description: "New application name (e.g. orders, my-svc). Drives PascalCase + kebab identity."
        required: true
        type: string
      owner:
        description: "GitHub owner (user/org) that will own the new repo."
        required: false
        default: "lurodrisilva"
        type: string
      domain:
        description: "Domain word (reserved for the future domain-rename; not yet applied)."
        required: false
        default: "account"
        type: string
      description:
        description: "Description for the new repository."
        required: false
        default: ""
        type: string

# Minimal token for this workflow: it only needs to read this template to render
# it. All writes to the TARGET repo go through the minted GitHub App token.
permissions:
  contents: read

# Never scaffold the same app twice concurrently (double-dispatch guard). We do
# NOT cancel an in-flight run — cancelling mid-push would leave a half-pushed repo.
concurrency:
  group: scaffold-new-app-${{ inputs.appName }}
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out THIS template repo (the render source).
      - name: Checkout template
        uses: actions/checkout@v7

      # 2. Mint a short-lived GitHub App installation token scoped to `owner`,
      #    so it can create + push the new repo under that owner. The action
      #    auto-masks the token in logs; downstream steps read it from the
      #    step output and NEVER echo it.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SCAFFOLDER_APP_ID }}
          private-key: ${{ secrets.SCAFFOLDER_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}

      # 3. Compute the two identities from appName:
      #      APP_PASCAL — split on - _ space, capitalize each part (orders->Orders,
      #                   my-svc->MySvc). Used for namespaces / sln / csproj.
      #      APP_KEBAB  — lowercased appName with _ and spaces normalized to '-'.
      #                   Used for helm/chart/k8s names AND the target repo name.
      #    appName is read from an env var (not interpolated into the script body)
      #    to avoid shell-injection from the dispatch input.
      - name: Compute identities
        id: ids
        env:
          APP_NAME_INPUT: ${{ inputs.appName }}
          DOMAIN_INPUT: ${{ inputs.domain }}
        run: |
          set -euo pipefail
          raw="$APP_NAME_INPUT"
          kebab="$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | tr '_ ' '--')"
          pascal=""
          IFS='-_ ' read -ra parts <<< "$raw"
          for p in "${parts[@]}"; do
            [ -z "$p" ] && continue
            first="$(printf '%s' "${p:0:1}" | tr '[:lower:]' '[:upper:]')"
            pascal="${pascal}${first}${p:1}"
          done
          if [ -z "$kebab" ] || [ -z "$pascal" ]; then
            echo "error: appName '$raw' produced an empty identity" >&2
            exit 1
          fi
          {
            echo "APP_PASCAL=$pascal"
            echo "APP_KEBAB=$kebab"
          } >> "$GITHUB_ENV"
          echo "pascal=$pascal" >> "$GITHUB_OUTPUT"
          echo "kebab=$kebab"   >> "$GITHUB_OUTPUT"
          echo "Computed APP_PASCAL=$pascal  APP_KEBAB=$kebab  (domain input='$DOMAIN_INPUT' reserved, not applied)"

      # 4. Create the target repo. Idempotent: if it already exists we log and
      #    proceed to (re)push. GH_TOKEN is the App token via env (never echoed).
      - name: Create target repository (idempotent)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ inputs.owner }}
          REPO_DESC: ${{ inputs.description }}
        run: |
          set -euo pipefail
          if gh repo view "$OWNER/$APP_KEBAB" >/dev/null 2>&1; then
            echo "Repo $OWNER/$APP_KEBAB already exists — proceeding to push (idempotent)."
          else
            gh repo create "$OWNER/$APP_KEBAB" --private --description "$REPO_DESC"
            echo "Created $OWNER/$APP_KEBAB (private)."
          fi

      # 5. Render this template into $RUNNER_TEMP/rendered with the new identity.
      - name: Render template
        run: |
          set -euo pipefail
          bash scripts/scaffold-render.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/rendered" "$APP_PASCAL" "$APP_KEBAB"

      # 6. Initialize a fresh history in the rendered tree and push it to the new
      #    repo. The App token is injected into the remote URL from an env var and
      #    is auto-masked in logs; it is never printed by the script itself.
      - name: Commit and push rendered app
        env:
          GIT_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ inputs.owner }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rendered"
          git init -b main
          git config user.name  "platform-scaffolder[bot]"
          git config user.email "platform-scaffolder[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: scaffold ${APP_PASCAL} from net-hexagonal template"
          git remote add origin "https://x-access-token:${GIT_TOKEN}@github.com/${OWNER}/${APP_KEBAB}.git"
          git push -u origin main

      # 7. Report the new repo URL (also surfaced as a workflow notice).
      - name: Report
        env:
          OWNER: ${{ inputs.owner }}
        run: |
          set -euo pipefail
          url="https://github.com/${OWNER}/${APP_KEBAB}"
          echo "Scaffolded ${APP_PASCAL} → ${url}"
          echo "::notice title=Scaffolded app::${APP_PASCAL} → ${url}"
