# =============================================================================
# scaffold-new-app.yml — the ADR-0009 golden-path "create" scaffolder.
#
# WHAT THIS IS
#   A workflow_dispatch workflow that renders THIS net-hexagonal template (the
#   concrete "Hex.Scaffold" service) into a BRAND-NEW GitHub repository for a
#   requested application. It is the "create" half of the golden path and is
#   kept DELIBERATELY OUTSIDE the platform orchestrator (ADR-0009): the
#   orchestrator's POST /api/v1/apps dispatches this workflow; the render + repo
#   creation + push all happen here on GitHub Actions, not in orchestrator code.
#
# HOW IT AUTHENTICATES
#   Repo create + push use a fine-grained Personal Access Token in this repo's
#   Actions secrets:
#       SCAFFOLDER_CREATE_TOKEN  — fine-grained PAT, resource owner = the account
#                                  that owns the new repos, with repository
#                                  permissions Administration:write (create),
#                                  Contents:write (push), and Workflows:write
#                                  (the rendered template ships .github/workflows/*;
#                                  GitHub rejects a push that creates/updates
#                                  workflow files without it — Contents:write is
#                                  NOT sufficient). "All repositories" because the
#                                  target repo does not exist yet.
#   A PAT (not a GitHub App installation token) is required because `owner` here
#   is a USER account, and a GitHub App CANNOT create a repository in a user
#   account — POST /user/repos only accepts a user token (ADR-0009 amendment
#   2026-07-20). The GitHub App the orchestrator holds is used ONLY by the
#   orchestrator to dispatch this workflow and read repo existence; it is not
#   used inside this run.
#
# WHAT IT DOES NOT DO
#   The render is heuristic (sed-based; see scripts/scaffold-render.sh). It does
#   NOT rename the sample DOMAIN ("account") — the scaffolded app keeps the
#   reference domain. A real template engine + domain-rename is a documented
#   follow-up (docs/scaffolder.md). The `domain` input below is accepted and
#   recorded for that future step but does not yet drive substitution.
# =============================================================================
name: scaffold-new-app

on:
  workflow_dispatch:
    inputs:
      appName:
        description: "New application name (e.g. orders, my-svc). Drives PascalCase + kebab CODE identity."
        required: true
        type: string
      repoName:
        description: "Target repository name (usually appName + a collision-avoidance suffix). Defaults to the kebab of appName when empty."
        required: false
        default: ""
        type: string
      owner:
        description: "GitHub owner (user/org) that will own the new repo."
        required: false
        default: "lurodrisilva"
        type: string
      domain:
        description: "Domain word (reserved for the future domain-rename; not yet applied)."
        required: false
        default: "account"
        type: string
      description:
        description: "Description for the new repository."
        required: false
        default: ""
        type: string

# Minimal token for this workflow: it only needs to read this template to render
# it. All writes to the TARGET repo go through SCAFFOLDER_CREATE_TOKEN (the PAT).
permissions:
  contents: read

# Never scaffold the same app twice concurrently (double-dispatch guard). We do
# NOT cancel an in-flight run — cancelling mid-push would leave a half-pushed repo.
concurrency:
  group: scaffold-new-app-${{ inputs.appName }}
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out THIS template repo (the render source).
      - name: Checkout template
        uses: actions/checkout@v4

      # 2. Compute the CODE identities from appName, and the TARGET REPO name:
      #      APP_PASCAL — split on - _ space, capitalize each part (orders->Orders,
      #                   my-svc->MySvc). Used for namespaces / sln / csproj.
      #      APP_KEBAB  — lowercased appName with _ and spaces normalized to '-'.
      #                   Used for helm/chart/k8s names (the app identity).
      #      TARGET_REPO — the repository to create/push. Defaults to APP_KEBAB;
      #                   the orchestrator passes appName + a random suffix so
      #                   repeated scaffolds never collide, WITHOUT polluting the
      #                   code identity. Validated as a GitHub-safe slug.
      #    All inputs are read from env vars (not interpolated into the script
      #    body) to avoid shell-injection from the dispatch inputs.
      - name: Compute identities
        id: ids
        env:
          APP_NAME_INPUT: ${{ inputs.appName }}
          REPO_NAME_INPUT: ${{ inputs.repoName }}
          DOMAIN_INPUT: ${{ inputs.domain }}
        run: |
          set -euo pipefail
          raw="$APP_NAME_INPUT"
          kebab="$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | tr '_ ' '--')"
          pascal=""
          IFS='-_ ' read -ra parts <<< "$raw"
          for p in "${parts[@]}"; do
            [ -z "$p" ] && continue
            first="$(printf '%s' "${p:0:1}" | tr '[:lower:]' '[:upper:]')"
            pascal="${pascal}${first}${p:1}"
          done
          if [ -z "$kebab" ] || [ -z "$pascal" ]; then
            echo "error: appName '$raw' produced an empty identity" >&2
            exit 1
          fi
          target="$REPO_NAME_INPUT"
          [ -z "$target" ] && target="$kebab"
          # Tolerate a fully-qualified "owner/repo" pasted into repoName (common on
          # a manual `gh workflow run`): the repository NAME is a bare slug and the
          # owner comes from the separate `owner` input, so drop any leading path
          # and keep only the basename before validating.
          if printf '%s' "$target" | grep -q '/'; then
            stripped="${target##*/}"
            echo "::notice title=repoName normalized::stripped owner prefix '$target' -> '$stripped'"
            target="$stripped"
          fi
          if ! printf '%s' "$target" | grep -Eq '^[a-z0-9][a-z0-9-]{0,38}$'; then
            echo "error: repoName '$target' is not a valid GitHub slug (lowercase alnum + hyphen, 1-39)" >&2
            exit 1
          fi
          {
            echo "APP_PASCAL=$pascal"
            echo "APP_KEBAB=$kebab"
            echo "TARGET_REPO=$target"
          } >> "$GITHUB_ENV"
          {
            echo "pascal=$pascal"
            echo "kebab=$kebab"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"
          echo "Computed APP_PASCAL=$pascal  APP_KEBAB=$kebab  TARGET_REPO=$target  (domain input='$DOMAIN_INPUT' reserved, not applied)"

      # 3. Create the target repo. Idempotent: if it already exists we log and
      #    proceed to (re)push. GH_TOKEN is the PAT via env (never echoed).
      - name: Create target repository (idempotent)
        env:
          GH_TOKEN: ${{ secrets.SCAFFOLDER_CREATE_TOKEN }}
          OWNER: ${{ inputs.owner }}
          REPO_DESC: ${{ inputs.description }}
        run: |
          set -euo pipefail
          if gh repo view "$OWNER/$TARGET_REPO" >/dev/null 2>&1; then
            echo "Repo $OWNER/$TARGET_REPO already exists — proceeding to push (idempotent)."
          else
            gh repo create "$OWNER/$TARGET_REPO" --private --description "$REPO_DESC"
            echo "Created $OWNER/$TARGET_REPO (private)."
          fi

      # 4. Render this template into $RUNNER_TEMP/rendered with the new identity.
      #    Render uses the CLEAN code identity (APP_PASCAL/APP_KEBAB), never the
      #    suffixed TARGET_REPO — the scaffolded code stays clean.
      - name: Render template
        run: |
          set -euo pipefail
          bash scripts/scaffold-render.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/rendered" "$APP_PASCAL" "$APP_KEBAB"

      # 5. Initialize a fresh history in the rendered tree and push it to the new
      #    repo. The PAT is injected into the remote URL from an env var and is
      #    auto-masked in logs; it is never printed by the script itself.
      - name: Commit and push rendered app
        env:
          GIT_TOKEN: ${{ secrets.SCAFFOLDER_CREATE_TOKEN }}
          OWNER: ${{ inputs.owner }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rendered"
          git init -b main
          git config user.name  "platform-scaffolder[bot]"
          git config user.email "platform-scaffolder[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: scaffold ${APP_PASCAL} from net-hexagonal template"
          git remote add origin "https://x-access-token:${GIT_TOKEN}@github.com/${OWNER}/${TARGET_REPO}.git"
          git push -u origin main

      # 6. Report the new repo URL (also surfaced as a workflow notice).
      - name: Report
        env:
          OWNER: ${{ inputs.owner }}
        run: |
          set -euo pipefail
          url="https://github.com/${OWNER}/${TARGET_REPO}"
          echo "Scaffolded ${APP_PASCAL} → ${url}"
          echo "::notice title=Scaffolded app::${APP_PASCAL} → ${url}"
